name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation-and-syntax:
    name: Markdown and Python syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check Python syntax
        run: python -m compileall -q main.py config.py models routers services tests
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Markdown
        run: npx --yes markdownlint-cli2@0.17.2 '**/*.md' '#node_modules' '#.venv' '#storage' '#runtime' '#models/gguf' '#.git' '#.superpowers'
